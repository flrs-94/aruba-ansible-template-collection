---
# ============================================================================
# EN: Target state ("source of truth") for the Trust-Anchor (TA) profiles that
#     the play_ca.yml playbook manages on the AOS-CX switches. Each list entry
#     is one TA profile (a CA certificate the switch should trust).
#
# DE: Soll-Zustand ("Source of Truth") der Trust-Anchor-(TA-)Profile, die das
#     Playbook play_ca.yml auf den AOS-CX-Switches verwaltet. Jeder Listeneintrag
#     ist ein TA-Profil (ein CA-Zertifikat, dem der Switch vertrauen soll).
# ----------------------------------------------------------------------------
# EN: Schema per list entry
#   name          (str, required)  TA profile name on the switch (used as the
#                                  REST API path -> keep it short, no spaces)
#   target_hosts  (list, required) inventory host names this profile applies to,
#                                  or ["all"] for every host in the inventory
#   cert_data     (str, required)  the CA certificate in PEM format, as a block
#                                  scalar (|-). No leading spaces before
#                                  "-----BEGIN CERTIFICATE-----".
#
# DE: Schema je Listeneintrag
#   name          (str, Pflicht)   Name des TA-Profils auf dem Switch (wird als
#                                  REST-API-Pfad genutzt -> kurz, keine Leerzeichen)
#   target_hosts  (list, Pflicht)  Inventory-Hostnamen, für die das Profil gilt,
#                                  oder ["all"] für jeden Host im Inventory
#   cert_data     (str, Pflicht)   das CA-Zertifikat im PEM-Format als
#                                  Block-Skalar (|-). Keine führenden Leerzeichen
#                                  vor "-----BEGIN CERTIFICATE-----".
# ----------------------------------------------------------------------------
# EN: The certificates below are throw-away self-signed CAs
#     (C=XX, O=Example Organization) - REPLACE them with your own CA chain.
# DE: Die Zertifikate unten sind Wegwerf-Selbstsignate
#     (C=XX, O=Example Organization) - durch die eigene CA-Kette ERSETZEN.
# ============================================================================
