---
# ============================================================================
# EN: Target state for the Trust Anchor (TA) profiles managed by play_ca.yml.
#     One list entry per TA profile. The playbook creates missing profiles,
#     replaces differing ones (after confirmation) and offers to delete
#     profiles on the switch that are no longer listed here.
#
# DE: Soll-Zustand der TA-Profile, die play_ca.yml verwaltet. Ein Listeneintrag
#     je TA-Profil. Das Playbook legt fehlende Profile an, ersetzt abweichende
#     (nach Bestätigung) und bietet an, Profile auf dem Switch zu löschen, die
#     hier nicht mehr gelistet sind.
# ----------------------------------------------------------------------------
# EN: Schema per list entry
#   name          (str, required)  TA profile name on the switch
#   target_hosts  (list, required) inventory host names, or ["all"] for every
#                                  host; entries without target_hosts are ignored
#   cert_data     (str, required)  CA certificate in PEM format, as a block
#                                  scalar `|-`, no extra leading whitespace
#                                  before -----BEGIN CERTIFICATE-----
#
# DE: Schema je Listeneintrag
#   name          (str, Pflicht)   Name des TA-Profils auf dem Switch
#   target_hosts  (list, Pflicht)  Inventory-Hostnamen oder ["all"] für alle
#                                  Hosts; Einträge ohne target_hosts werden ignoriert
#   cert_data     (str, Pflicht)   CA-Zertifikat im PEM-Format als Block-Skalar
#                                  `|-`, ohne zusätzliche führende Leerzeichen
#                                  vor -----BEGIN CERTIFICATE-----
# ----------------------------------------------------------------------------
# EN: The entries below are generic PLACEHOLDERS. Replace the names, the
#     target hosts and the PEM data with your own CA certificates.
#     Only public CA certificates belong here - NEVER a private key.
# DE: Die folgenden Einträge sind generische PLATZHALTER. Namen, Zielhosts und
#     PEM-Daten durch die eigenen CA-Zertifikate ersetzen.
#     Hier gehören nur öffentliche CA-Zertifikate hin - NIEMALS ein privater Schlüssel.
# ============================================================================
ta_profiles:
  - name: "example_root_ca"
    target_hosts:
      - "aoscx_1" # EN: single switches or ["all"] / DE: einzelne Switches oder ["all"]
    cert_data: |-
      -----BEGIN CERTIFICATE-----
      YOUR_ROOT_CA_CERTIFICATE_BASE64
      -----END CERTIFICATE-----

  - name: "example_intermediate_ca" # EN: example intermediate CA / DE: beispielhaftes Intermediate-Zertifikat
    target_hosts:
      - "aoscx_1" # EN: single switches or ["all"] / DE: einzelne Switches oder ["all"]
    cert_data: |-
      -----BEGIN CERTIFICATE-----
      YOUR_INTERMEDIATE_CA_CERTIFICATE_BASE64
      -----END CERTIFICATE-----
